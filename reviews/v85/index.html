<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>位置調整と裾の確認 v85｜キャラクターデザイン工房</title><style>*{box-sizing:border-box}body{font:16px/1.7 system-ui;background:#faf7fd;color:#403549;margin:0}main{max-width:1380px;margin:auto;padding:20px}h1{font-size:clamp(22px,4vw,30px)}h2{font-size:18px}.choices{display:flex;gap:8px;flex-wrap:wrap}label{background:white;border:1px solid #d9cadf;border-radius:20px;padding:8px 12px;cursor:pointer}label:has(:checked){background:#eee0f6;border-color:#86549d}fieldset{border:0;padding:0;margin:20px 0}legend{font-weight:bold}input{accent-color:#86549d}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.hems{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}article{background:white;border:1px solid #e4d9eb;border-radius:12px;padding:12px;text-align:center;min-width:0}img{width:100%;height:auto;display:block}a{color:#75478f}small{color:#72667b}.links{display:flex;flex-wrap:wrap;gap:16px}[hidden]{display:none!important}@media(max-width:600px){main{padding:12px}.grid,.hems{gap:6px}article{padding:5px}article h2{font-size:13px}label{font-size:14px;padding:6px 9px}}</style><main><h1>位置調整と裾の確認 v85</h1><p>いただいた33組の調整値をそのまま反映しました。パーカーなど6種類の裾は、デザイン案の形を保ちながら体の幅に合わせています。</p><p><small>肩・袖・襟と、パンツ自体の画素・丈は維持しています。着せ替え本体への公開反映前の確認ページです。</small></p><p class="links"><a href="../pants-fit/index.html?v=85">位置合わせツールで再調整する</a><a href="approved-positions.json" download>今回反映した調整値を保存</a></p><fieldset><legend>トップス</legend><div class="choices"><label><input type="radio" name="top" value="blouse" >ブラウス</label><label><input type="radio" name="top" value="sailor" >セーラーふう</label><label><input type="radio" name="top" value="cardigan" >カーディガン</label><label><input type="radio" name="top" value="tshirt" >Tシャツ</label><label><input type="radio" name="top" value="relaxed" >ゆったりTシャツ</label><label><input type="radio" name="top" value="hoodie" checked>ゆったりパーカー</label><label><input type="radio" name="top" value="sweatshirt" >ゆったりスウェット</label><label><input type="radio" name="top" value="collared_sweatshirt" >シャツ重ねスウェット</label><label><input type="radio" name="top" value="longsleeve" >長袖カットソー</label><label><input type="radio" name="top" value="open_shirt" >羽織りシャツ</label><label><input type="radio" name="top" value="knit_vest" >シャツ重ねニットベスト</label></div></fieldset><section class="grid"><article data-bottom="shorts"><h2>ショートパンツ</h2><a href="images/hoodie-shorts.webp" target="_blank" rel="noopener"><img src="images/hoodie-shorts.webp" alt="ショートパンツの修正後" width="768" height="1152"></a><p class="position"></p></article><article data-bottom="cropped_wide"><h2>七分丈</h2><a href="images/hoodie-cropped_wide.webp" target="_blank" rel="noopener"><img src="images/hoodie-cropped_wide.webp" alt="七分丈の修正後" width="768" height="1152"></a><p class="position"></p></article><article data-bottom="wide_pants"><h2>くるぶし丈</h2><a href="images/hoodie-wide_pants.webp" target="_blank" rel="noopener"><img src="images/hoodie-wide_pants.webp" alt="くるぶし丈の修正後" width="768" height="1152"></a><p class="position"></p></article></section><section id="hem-section"><h2>裾の変更前後（パンツはどちらも今回の調整値）</h2><div class="hems"><article><h2>裾の変更前</h2><a id="before-link" href="images/hoodie-hem-before.webp" target="_blank" rel="noopener"><img id="before" src="images/hoodie-hem-before.webp" width="768" height="640" alt="裾の変更前"></a></article><article><h2>裾の変更後</h2><a id="after-link" href="images/hoodie-hem-after.webp" target="_blank" rel="noopener"><img id="after" src="images/hoodie-hem-after.webp" width="768" height="640" alt="裾の変更後"></a></article></div><details><summary>デザイン案を見る</summary><a id="design-link" href="images/hoodie-design.webp" target="_blank" rel="noopener">デザイン原画を開く</a></details></section><p id="unchanged" hidden>このトップスは裾を変更せず、パンツの位置だけを反映しています。</p><p><a href="../v84/">調整前の比較ページ</a> ／ <a href="../../">公開中の着せ替えアプリ</a></p><script>(()=>{const ids=new Set(["blouse", "sailor", "cardigan", "tshirt", "relaxed", "hoodie", "sweatshirt", "collared_sweatshirt", "longsleeve", "open_shirt", "knit_vest"]),hems=new Set(['hoodie','sweatshirt','collared_sweatshirt','longsleeve','open_shirt','knit_vest']);let positions;function change(top){if(!ids.has(top))top='hoodie';document.querySelector('input[value="'+top+'"]').checked=true;for(const card of document.querySelectorAll('[data-bottom]')){const file='images/'+top+'-'+card.dataset.bottom+'.webp';card.querySelector('img').src=file;card.querySelector('a').href=file;const v=positions?.positions?.[top+'/'+card.dataset.bottom];card.querySelector('.position').textContent=v?'上下 '+v.y+'px':'';}document.getElementById('hem-section').hidden=!hems.has(top);document.getElementById('unchanged').hidden=hems.has(top);if(hems.has(top)){for(const id of ['before','after']){const file='images/'+top+'-hem-'+id+'.webp';document.getElementById(id).src=file;document.getElementById(id+'-link').href=file;}document.getElementById('design-link').href='images/'+top+'-design.webp';}history.replaceState(null,'','?top='+top);}document.querySelectorAll('input[name=top]').forEach(i=>i.addEventListener('change',()=>change(i.value)));fetch('approved-positions.json').then(r=>r.json()).then(p=>{positions=p;change(new URLSearchParams(location.search).get('top')||'hoodie');});change(new URLSearchParams(location.search).get('top')||'hoodie');})();</script></main></html>
