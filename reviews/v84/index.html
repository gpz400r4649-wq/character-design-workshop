<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>採用パンツの確認 v84｜キャラクターデザイン工房</title><style>*{box-sizing:border-box}body{margin:0;background:#faf7fd;color:#403549;font:16px/1.7 system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:20px}h1{font-size:clamp(22px,5vw,30px)}fieldset{border:0;padding:0;margin:20px 0}nav{display:flex;gap:8px;flex-wrap:wrap}label{background:white;border:1px solid #cfc0dc;border-radius:20px;padding:8px 12px;cursor:pointer}label:has(:checked){background:#eee1f7;border-color:#84559e}input{accent-color:#84559e}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}article{background:white;border:1px solid #e4d9eb;border-radius:14px;padding:12px;text-align:center;min-width:0}h2{font-size:17px}img{display:block;width:100%;height:auto}a{color:#70418e}button{font:inherit}small{color:#6c6274}details{margin-top:24px}summary{cursor:pointer;font-weight:bold}.originals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media(max-width:600px){main{padding:12px}.grid{gap:6px}article{padding:5px;border-radius:8px}h2{font-size:13px}.download{font-size:12px}label{font-size:14px;padding:6px 9px}}@media(prefers-reduced-motion:no-preference){label{transition:background .15s}}</style><main><p><a href="../v85/">今回の調整値と裾の修正を反映した確認ページ v85</a></p><p><a href="../pants-fit/">服ごとにパンツの位置を調整する（ショートパンツも対応）</a></p><h1>採用パンツの確認 v84</h1><p>左から基準のショートパンツ、採用した七分丈、くるぶし丈です。既存の体・脚・靴で組み合わせた実装結果を確認できます。</p><p><small>確認用の画像プレビューです。画像をタップすると原寸で開けます。着せ替え本体への公開反映はまだ行っていません。</small></p><fieldset><legend>トップスを切り替える</legend><nav><label><input type="radio" name="top" value="blouse" checked>ブラウス</label><label><input type="radio" name="top" value="tshirt" >Tシャツ</label><label><input type="radio" name="top" value="relaxed" >ゆったりTシャツ</label><label><input type="radio" name="top" value="hoodie" >パーカー</label><label><input type="radio" name="top" value="collared_sweatshirt" >襟付きスウェット</label></nav></fieldset><section class="grid"><article data-bottom="shorts"><h2>基準ショートパンツ</h2><a class="image-link" href="images/blouse-shorts.png" target="_blank" rel="noopener"><img src="images/blouse-shorts.png" alt="基準ショートパンツの実装プレビュー" width="2048" height="3072"></a><a class="download" href="images/blouse-shorts.png" download>PNGを保存</a></article><article data-bottom="cropped_wide"><h2>七分丈</h2><a class="image-link" href="images/blouse-cropped_wide.png" target="_blank" rel="noopener"><img src="images/blouse-cropped_wide.png" alt="七分丈の実装プレビュー" width="2048" height="3072"></a><a class="download" href="images/blouse-cropped_wide.png" download>PNGを保存</a></article><article data-bottom="wide_pants"><h2>くるぶし丈</h2><a class="image-link" href="images/blouse-wide_pants.png" target="_blank" rel="noopener"><img src="images/blouse-wide_pants.png" alt="くるぶし丈の実装プレビュー" width="2048" height="3072"></a><a class="download" href="images/blouse-wide_pants.png" download>PNGを保存</a></article></section><details><summary>クラウドで採用した原画を見る</summary><div class="originals"><article><h2>七分丈の採用原画</h2><a href="images/wide-pants-cropped-approved.png" target="_blank" rel="noopener"><img loading="lazy" src="images/wide-pants-cropped-approved.png" alt="七分丈の採用原画" width="1024" height="1536"></a></article><article><h2>くるぶし丈の採用原画</h2><a href="images/wide-pants-ankle-approved.png" target="_blank" rel="noopener"><img loading="lazy" src="images/wide-pants-ankle-approved.png" alt="くるぶし丈の採用原画" width="1024" height="1536"></a></article></div></details><p><a href="../../">公開中の着せ替えアプリへ</a></p><script>const tops=new Set(['blouse','tshirt','relaxed','hoodie','collared_sweatshirt']);function change(top){if(!tops.has(top))top='blouse';document.querySelector('input[value="'+top+'"]').checked=true;for(const card of document.querySelectorAll('[data-bottom]')){const url='images/'+top+'-'+card.dataset.bottom+'.png';card.querySelector('img').src=url;for(const a of card.querySelectorAll('a'))a.href=url;}history.replaceState(null,'','?top='+top);}document.querySelectorAll('input[name=top]').forEach(i=>i.addEventListener('change',()=>change(i.value)));change(new URLSearchParams(location.search).get('top')||'blouse');</script></main></html>
