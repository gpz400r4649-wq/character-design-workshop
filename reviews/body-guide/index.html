<body><main><h1>服合わせの固定素体と基準点</h1><p>今のキャラクターの腕・脚・靴の位置を固定し、不透明な練習スーツで全身を覆いました。服をこの基準へ合わせていきます。</p><p id="status" role="status">素体を読み込んでいます…</p><div class="layout"><section class="figure"><canvas id="preview" width="768" height="1152" aria-label="練習用スーツの固定素体と12個の基準点"></canvas></section><section class="panel"><h2>共通の基準</h2><p>肩・腰・ヒップ・股・膝・足首に、12個の点を置いています。基準点は服を切り替えても動きません。</p><div class="toggles"><label><input id="guides" type="checkbox" checked>基準点と線を表示</label><label><input id="labels" type="checkbox" checked>線の名前を表示</label><label><input id="grid" type="checkbox">マス目を表示</label></div><p class="actions"><a class="primary" href="../pants-fit/index.html?v=86&view=pants">素体にパンツを合わせる</a><button id="body-png" disabled>素体だけのPNGを保存</button><button id="guide-png" disabled>基準点つきPNGを保存</button><button id="lines-png" disabled>基準線だけのPNGを保存</button><button id="json" disabled>基準点のJSONを保存</button><a href="reference-body.svg?v=86" download="fixed-body-v86.svg">素体のSVGを保存</a></p><p class="note">肩や胴は、服に隠れていた部分を補った簡略図です。胸部などの細部を描かず、服合わせの目安として使います。</p><details><summary>基準点の座標（2048 × 3072）</summary><div class="table-scroll"><table><thead><tr><th>基準点</th><th>X</th><th>Y</th></tr></thead><tbody id="coordinates"></tbody></table></div></details><p><a href="../v85/">服の確認ページへ</a></p></section></div><p><a href="../top-fit/index.html?v=88">トップスの位置合わせへ</a></p></main><script src="body-guide.js?v=86"></script><script src="page.js?v=86"></script></body></html>
