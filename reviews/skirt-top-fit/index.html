<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>裾だけの調整｜スカート用トップス</title><link rel="stylesheet" href="../pants-fit/editor.css?v=87"><style>fieldset label{display:inline-block;margin:6px}input[type=number]{width:85px;float:right}#upper{height:auto}</style></head><body><main><h1>スカート用トップス・裾だけの調整</h1><p>袖・肩・襟・上半身とフレアスカートを固定し、裾だけを調整します。</p><p id="status" role="status">読み込み中…</p><div id="editor" hidden><fieldset><legend>裾を調整するトップス</legend><div id="tops"></div></fieldset><div class="workspace"><section class="views"><div class="view"><h2>全身（固定スカート）</h2><canvas id="full" width="512" height="768"></canvas></div><div class="view"><h2>裾の拡大</h2><canvas id="upper" width="784" height="640"></canvas></div></section><section class="panel"><h2 id="title">裾の調整</h2><div id="controls"></div><p>幅・上下・中央の丸み・左右の高さを調整できます。袖と服全体を動かす操作はありません。</p><div class="actions"><button id="undo">元に戻す</button><button id="redo">やり直す</button><button id="reset">この裾を初期状態に戻す</button></div><label><input type="checkbox" id="guides" checked>スカートの基準線を表示</label><hr><div class="actions"><button id="png">スカート用トップスの透過PNGを保存</button><button id="save">裾の調整値を保存</button><button id="load">裾の調整値を読み込む</button><input type="file" id="file" accept=".json" hidden></div><p>パンツ用とは別に保存します。完成したPNGとJSONを送ってください。</p><a href="../top-fit/index.html">パンツ用のトップス画面</a></section></div></div></main><script src="../body-guide/body-guide.js?v=86"></script><script src="mesh.js?v=89"></script><script src="hem-editor.js?v=111"></script></body></html>
