<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>元の脚に履き替えた靴のデザイン案</title><style>*{box-sizing:border-box}body{margin:0;background:#faf7fe;color:#493d51;font:16px/1.7 Meiryo,sans-serif}main{max-width:1100px;margin:auto;padding:20px}h1{font-size:25px}nav{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}button,a{font:inherit;color:inherit}button{background:white;padding:10px 14px;border:1px solid #cbb9dd;border-radius:10px;min-height:44px}button[aria-pressed=true]{background:#765493;color:white}.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px}.pair section{background:white;border:1px solid #d9c9e7;border-radius:15px;padding:12px}h2{font-size:18px}img{display:block;width:100%;height:auto}.overlay{position:relative}.overlay img:first-child{opacity:var(--base,1)}.overlay img:last-child{position:absolute;inset:0;opacity:var(--new,0)}.options{display:flex;flex-wrap:wrap;gap:16px;align-items:center}input[type=range]{width:200px}a{display:inline-block;margin:12px 0;color:#765493}.note{font-size:14px}button:focus-visible,a:focus-visible{outline:3px solid #277f83}@media(max-width:600px){main{padding:12px}.pair{gap:8px}.pair section{padding:6px}h2{font-size:15px}}</style><main><h1>元の脚に履き替えた靴のデザイン案</h1><p>元の脚・足の向きを基準に、履いている靴だけを変更した案です。まずデザインと着用時の形を確認します。</p><nav id="types" aria-label="靴の種類"></nav><div class="options"><label><input id="overlap" type="checkbox">元の脚に重ねて比較</label><label>案の濃さ <input id="opacity" type="range" min="0" max="100" value="50"></label></div><p class="note">重ねたときの細かなずれも確認してください。生成された案は、まだ位置・形の確定版ではありません。</p><div class="pair"><section><h2>元の脚と靴</h2><div id="overlay" class="overlay"><img src="assets/original-legs.png" alt="基準となる元の脚とストラップ靴"><img id="ghost" alt="履き替え案との比較" hidden></div></section><section><h2 id="name"></h2><img id="design" alt="元の脚に履き替えたデザイン案"><a id="download" download>着用状態のPNGを保存</a></section></div><p class="note">編み上げロングブーツも着用案に追加しました。前の靴単体の案は今回の候補から外しています。</p><p id="status" role="status"></p></main><script>
(async()=>{try{const data=await(await fetch('assets/catalog.json?v=138')).json(),$=id=>document.getElementById(id);function select(item){$('name').textContent=item.name;$('design').src=item.url;$('ghost').src=item.url;$('download').href=item.url;$('download').download=item.id+'-worn-design.png';document.querySelectorAll('#types button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===item.id)));}for(const item of data){const b=document.createElement('button');b.textContent=item.name;b.dataset.id=item.id;b.onclick=()=>select(item);$('types').appendChild(b);}function sync(){$('ghost').hidden=!$('overlap').checked;$('overlay').style.setProperty('--new',Number($('opacity').value)/100);$('overlay').style.setProperty('--base',$('overlap').checked?.5:1);}$('overlap').onchange=sync;$('opacity').oninput=sync;const initial=new URLSearchParams(location.search).get('shoe');select(data.find(x=>x.id===initial)||data[0]);sync();window.shoeWornReady=true;}catch(e){document.getElementById('status').textContent='読み込めませんでした：'+e.message;}})();
</script></html>
